<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h5 class="card-title fw-bold mb-4">Nova Atividade</h5>

        @if (erro) {
          <div class="alert alert-danger py-2">{{ erro }}</div>
        }

        <div class="mb-3">
          <label class="form-label text-secondary">Tipo</label>
          <select class="form-select" [(ngModel)]="tipo">
            <option value="TAREFA">Tarefa</option>
            <option value="PROVA">Prova</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label text-secondary">Titulo *</label>
          <input type="text" class="form-control" [(ngModel)]="titulo" />
        </div>

        <div class="mb-3">
          <label class="form-label text-secondary">Descricao</label>
          <textarea class="form-control" rows="2" [(ngModel)]="descricao"></textarea>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label text-secondary">Data *</label>
            <input type="date" class="form-control" [(ngModel)]="data" />
          </div>
          <div class="col-md-6">
            <label class="form-label text-secondary">Prioridade</label>
            <select class="form-select" [(ngModel)]="prioridade">
              <option value="BAIXA">Baixa</option>
              <option value="MEDIA">Media</option>
              <option value="ALTA">Alta</option>
            </select>
          </div>
        </div>

        @if (tipo === 'TAREFA') {
          <div class="mb-3">
            <label class="form-label text-secondary">Tipo da Tarefa</label>
            <input type="text" class="form-control" [(ngModel)]="tipoDaTarefa" placeholder="Ex: Leitura, Exercicio" />
          </div>
        }

        @if (tipo === 'PROVA') {
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label text-secondary">Disciplina</label>
              <input type="text" class="form-control" [(ngModel)]="disciplina" />
            </div>
            <div class="col-md-6">
              <label class="form-label text-secondary">Nota Esperada</label>
              <input type="number" class="form-control" step="0.1" [(ngModel)]="notaEsperada" />
            </div>
          </div>
        }

        <div class="d-flex justify-content-between pt-2">
          <a routerLink="/atividades" class="btn btn-outline-secondary px-4">Cancelar</a>
          <button class="btn btn-primary px-4" (click)="salvar()" [disabled]="salvando">
            @if (salvando) { Salvando... } @else { Salvar }
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
