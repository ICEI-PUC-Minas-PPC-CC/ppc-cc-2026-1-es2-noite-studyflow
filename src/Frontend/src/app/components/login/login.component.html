<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <h4 class="fw-bold mb-1">StudyFlow</h4>
          <p class="text-secondary small mb-0">Gerencie suas atividades academicas</p>
        </div>
        @if (erro) {
          <div class="alert alert-danger py-2 small mb-3">{{ erro }}</div>
        }
        <div class="mb-3">
          <label class="form-label small fw-medium text-secondary">Nome</label>
          <input type="text" class="form-control" [(ngModel)]="nome" placeholder="Seu nome" />
        </div>
        <div class="mb-4">
          <label class="form-label small fw-medium text-secondary">Senha</label>
          <input type="password" class="form-control" [(ngModel)]="senha" placeholder="Sua senha" />
        </div>
        <button class="btn btn-primary w-100 py-2 fw-medium" (click)="entrar()">Entrar / Cadastrar</button>
        <p class="text-secondary text-center mt-3 small" style="font-size: 0.8rem;">
          Se o usuario nao existir, sera criado automaticamente.
        </p>
      </div>
    </div>
  </div>
</div>
